services:
  - type: web
    name: studiospace-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://studiospace-client-nine.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 199695232756-9b1its7cgdvpc03e1uo875fcc1ccvu8d.apps.googleusercontent.com
      - key: GOOGLE_CALLBACK_URL
        value: https://studiospace-server.onrender.com/api/auth/google/callback
      - key: JWT_EXPIRES_IN
        value: 7d
      # Sensitive credentials configured via Render Dashboard (sync: false)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
